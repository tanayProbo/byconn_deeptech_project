name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Test (hermetic; no network, browser, LLM or databases needed)
        run: pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
      # History before 0b33370 contains an API key that was committed and then
      # removed; it has to be revoked at the provider (see SECURITY.md). The
      # scan covers everything after that revert, so any new secret fails CI.
      - name: Scan for committed secrets
        run: ./gitleaks git --log-opts="0b33370..HEAD" --redact --verbose --exit-code 1
