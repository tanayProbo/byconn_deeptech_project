[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "byconn-x"
version = "0.1.0"
authors = [
  { name="Tanay Praveen Agrawal", email="tanayagrawal129@gmail.com" },
]
description = "Universal AI-Powered Data Acquisition Engine"
readme = "README.md"
requires-python = ">=3.10"
# SPDX license expression; the legacy "License ::" classifier is deprecated.
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# Kept in lockstep with requirements.txt. `sentence-transformers` is optional and
# lives under [project.optional-dependencies] because the embedder only imports
# it when it is the selected provider.
dependencies = [
    # Web server & API layer
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    # LLM providers
    "openai>=1.14.0",
    "google-generativeai>=0.4.0",
    "tiktoken>=0.6.0",
    # Databases & storage drivers
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "qdrant-client>=1.8.0",
    "neo4j>=5.18.0",
    "clickhouse-driver>=0.2.7",
    # Browser automation
    "playwright>=1.42.0",
    # Parsing, HTTP & system
    "beautifulsoup4>=4.12.3",
    "aiohttp>=3.9.3",
    "genson>=1.2.2",
    "psutil>=5.9.8",
    # Testing (mirrors requirements.txt so `pytest` works after install)
    "pytest",
]

[project.optional-dependencies]
# Local, key-free embedding provider for byconn.pipeline.embedder.
local-embeddings = ["sentence-transformers>=2.3.0"]

[project.scripts]
byconn = "byconn.main:cli"
byconn-server = "server:main"

[project.urls]
Homepage = "https://github.com/tanayProbo/byconn_deeptech_project"

[tool.setuptools]
# `server` is a top-level module (py-modules) rather than part of a package.
py-modules = ["server"]
packages = [
    "byconn",
    "byconn.core",
    "byconn.pipeline",
    "byconn.api_intelligence",
    "byconn.free_api_integration",
    "byconn.mobile",
    "byconn.storage",
    "byconn.visual_agent",
    "byconn.tests",
    # Data-only directories, registered so setuptools ships their contents
    # without warning that package-data references unregistered packages.
    # They contain no Python modules; server.py serves byconn/dashboard.
    "byconn.dashboard",
    "byconn.deployment.helm",
    "byconn.deployment.terraform",
    "byconn.docs",
]

# Non-Python assets must ship with the package: server.py mounts
# byconn/dashboard as static files, and the operator console would 404 without
# it. The sdist equivalent is declared in MANIFEST.in.
[tool.setuptools.package-data]
byconn = [
    "dashboard/*",
    "deployment/helm/*",
    "deployment/terraform/*",
    "docs/*",
]

[tool.pytest.ini_options]
testpaths = ["byconn/tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = [
    # qdrant-client emits this when the embedded engine is used in tests.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]
